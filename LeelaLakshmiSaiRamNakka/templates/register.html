<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AI Support Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                colors: { brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                          darkBg: '#0b0f19', darkCard: '#151b2c', darkBorder: '#222c44' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-darkBg dark:text-slate-100 antialiased font-sans flex items-center justify-center min-h-screen p-4">
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <div class="w-full max-w-md bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-darkBorder shadow-2xl p-8 relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-brand-500/10 dark:bg-brand-500/5 rounded-full blur-2xl"></div>

        <div class="text-center mb-8">
            <div class="inline-flex bg-gradient-to-tr from-brand-600 to-indigo-400 text-white p-3 rounded-xl shadow-md mb-4">
                <i class="fa-solid fa-user-plus text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Create your account</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Set up access to the support desk in seconds</p>
        </div>

        <form id="register-form" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Username</label>
                <input type="text" id="username" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-darkBorder rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white" placeholder="jane.miller">
            </div>
            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Email address</label>
                <input type="email" id="email" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-darkBorder rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white" placeholder="jane@company.com">
            </div>
            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Password</label>
                <input type="password" id="password" required minlength="6" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-darkBorder rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white" placeholder="At least 6 characters">
            </div>
            <div>
                <label for="confirm-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Confirm password</label>
                <input type="password" id="confirm-password" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-darkBorder rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white" placeholder="Re-enter password">
            </div>
            <button id="register-submit" type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3 rounded-xl text-sm font-semibold shadow-lg shadow-brand-600/15 transition-all mt-2">
                Create account
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 dark:border-darkBorder/60 text-center">
            <p class="text-xs text-slate-500 dark:text-slate-400">
                Already have an account?
                <a href="{{ url_for('login_page') }}" class="text-brand-600 dark:text-brand-400 font-semibold hover:underline">Sign in</a>
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('register-submit');
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                showToast("Passwords don't match", 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Creating account...';

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    showToast(data.error || 'Could not create account', 'error');
                    btn.disabled = false;
                    btn.innerText = 'Create account';
                    return;
                }
                showToast('Account created. Signing you in...', 'success');
                const loginRes = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (loginRes.ok) {
                    window.location.href = '{{ url_for("dashboard_page") }}';
                } else {
                    window.location.href = '{{ url_for("login_page") }}';
                }
            } catch (err) {
                showToast('Could not reach the server. Please try again.', 'error');
                btn.disabled = false;
                btn.innerText = 'Create account';
            }
        });
    </script>
</body>
</html>
