<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AI Support Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                colors: { brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                          darkBg: '#0b0f19', darkCard: '#151b2c', darkBorder: '#222c44' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-darkBg dark:text-slate-100 antialiased font-sans flex items-center justify-center min-h-screen p-4">
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <div class="w-full max-w-md bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-darkBorder shadow-2xl p-8 relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-brand-500/10 dark:bg-brand-500/5 rounded-full blur-2xl"></div>

        <div class="text-center mb-8">
            <div class="inline-flex bg-gradient-to-tr from-brand-600 to-indigo-400 text-white p-3 rounded-xl shadow-md mb-4">
                <i class="fa-solid fa-headset text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Welcome back</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Sign in to manage your support tickets</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Username or email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-user text-sm"></i></span>
                    <input type="text" id="username" required autocomplete="username" class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-darkBorder rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white" placeholder="you@company.com">
                </div>
            </div>
            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-lock text-sm"></i></span>
                    <input type="password" id="password" required autocomplete="current-password" class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-darkBorder rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white" placeholder="••••••••">
                </div>
            </div>
            <button id="login-submit" type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3 rounded-xl text-sm font-semibold shadow-lg shadow-brand-600/15 transition-all">
                Sign in
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 dark:border-darkBorder/60 text-center">
            <p class="text-xs text-slate-500 dark:text-slate-400">
                New here?
                <a href="{{ url_for('register_page') }}" class="text-brand-600 dark:text-brand-400 font-semibold hover:underline">Create an account</a>
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-submit');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerText = 'Signing in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    showToast(data.error || 'Invalid credentials', 'error');
                    btn.disabled = false;
                    btn.innerText = 'Sign in';
                    return;
                }
                window.location.href = '{{ url_for("dashboard_page") }}';
            } catch (err) {
                showToast('Could not reach the server. Please try again.', 'error');
                btn.disabled = false;
                btn.innerText = 'Sign in';
            }
        });
    </script>
</body>
</html>
